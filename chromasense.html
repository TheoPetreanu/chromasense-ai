<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaSense AI</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #F4E3D7;
    }

    .color-box {
      width: 30px;
      height: 30px;
      margin-right: 5px;
      display: inline-block;
      border: 1px solid black;
    }

    .color-code {
      display: inline-block;
      margin-left: 5px;
    }
  </style>
</head>

<body class="flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full md:w-3/4 lg:w-2/3 xl:w-1/2">

    <h1 class="text-4xl font-semibold mb-6 text-center">ChromaSense AI</h1>

    <div class="mb-8">
      <label for="inputImage" class="block text-lg mb-2">Select an Image</label>
      <input type="file" id="inputImage" class="block w-full h-32 border-2 border-gray-300 rounded-md cursor-pointer" />
    </div>

    <button onclick="submitImage()"
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full transition duration-300 ease-in-out transform hover:scale-105">
      Submit
    </button>

    <div id="outputContainer" class="mt-8 text-lg"></div>
    <div id="responseContainer" class="mt-8 text-lg"></div>
  </div>

  <script>
    // uses the Filereader api
    // Returns a Promise so it can be awaited before sending to the API
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file); // reads file as a data URL 
        reader.onload = () => resolve(reader.result.split(',')[1]); // strip the prefix, keep only the raw base64
        reader.onerror = error => reject(error);
      });
    }

    async function submitImage() {
      var fileInput = document.getElementById('inputImage');
      var file = fileInput.files[0];

      if (!file) {
        alert('Please select an image.');
        return;
      }

      try {
        var base64Image = await fileToBase64(file); // converts the uploaded file to base64

        // Send the image to GPT-4 Vision with a prompt asking for hex colour codes per region
        
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer APIKEY', // replace with API key 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: "gpt-4-vision-preview",
            max_tokens: 2000,
            messages: [{
              role: "user",
              content: [
                {
                  type: "text",
                  text: "Look at this uncolored drawing and try to understand what colors would be needed to complete it and still match the theme. Provide the color for each part in the format: 'Color: #HexCode; Part: part_name'. For example, 'Color: #FF0000; Part: Background'."
                },
                {
                  type: "image_url",
                  image_url: {
                    url: 'data:image/jpeg;base64,' + base64Image // embed image inline as base64 data URL
                  }
                }
              ]
            }]
          })
        });

        const data = await response.json();// The model returns in the format: 'Color: #HexCode; Part: part_name'
        displayResponse(data);

      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displayResponse(data) {
      var responseContainer = document.getElementById('responseContainer');
      responseContainer.innerHTML = '<h2 class="text-2xl font-semibold mb-2">Colour Analysis:</h2>';

      var content = data.choices[0].message.content; // extracts the text response from the API

      // The model returns one colour per line in the format: 'Color: #HexCode; Part: part_name'
      // Split into individual lines and parse each one
      var colorPartPairs = content.split('\n');

      var colorSquaresContainer = document.createElement('div');
      colorSquaresContainer.id = 'colorSquaresContainer';

      colorPartPairs.forEach(function (colorPartPair) {
        // Use regex to extract the hex code and part name from each line
        var colorMatch = colorPartPair.match(/Color: #([A-Fa-f0-9]{6});/); // matches exactly 6 hex characters
        var partMatch = colorPartPair.match(/Part: (.+)/);

        if (colorMatch && partMatch) { // only render if both fields were found
          var color = '#' + colorMatch[1];
          var part = partMatch[1];

          // Create a coloured square to show the hex colour
          var colorBox = document.createElement('div');
          colorBox.classList.add('color-box');
          colorBox.style.backgroundColor = color; // set the square's background to thehex code
          colorSquaresContainer.appendChild(colorBox);

          // Display the hex code and part name as text next to the square
          var colorText = document.createElement('span');
          colorText.textContent = color + " (" + part + ")";
          colorText.classList.add('color-code');
          colorSquaresContainer.appendChild(colorText);
          colorSquaresContainer.appendChild(document.createElement('br'));
        }
      });

      responseContainer.appendChild(colorSquaresContainer);
    }
  </script>
</body>

</html>
